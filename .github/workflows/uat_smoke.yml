name: uat_smoke
run-name: uat_smoke ${{ inputs.uuid }}
on:
  workflow_dispatch:
    inputs:
      uuid:
        description: UMT release chunk build row uuid
        required: true
      release_chunk_id:
        description: UMT release chunk id
        required: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sleep 30
      - run: test "$(cat .uat-outcome)" = success
